# Render Blueprint for Open WebUI — FREE-tier testing setup.
# Docs: https://render.com/docs/blueprint-spec
#
# How this works on the free plan (no persistent disk allowed):
# - Builds a tiny wrapper image (Dockerfile.render-free) FROM the prebuilt
#   `slim` image: fast build, no compiling, low RAM.
# - The wrapper runs a boot proxy (render_boot_proxy.py) that opens $PORT in
#   <1s so Render's port scan passes, while the real app warms up behind it
#   on 127.0.0.1:8081. Open the URL early and you'll see a "warming up" page
#   that auto-refreshes until the app is ready (a few minutes on 0.1 CPU).
# - Chats, users & settings persist in an external Postgres DB (free from Neon/Supabase).
# - Knowledge/RAG vectors live in the SAME Postgres via pgvector (no extra service).
# - Embeddings run via OpenAI's API instead of a local model, and Torch /
#   sentence-transformers / ChromaDB are all lazily imported, so none of them
#   load — this is what makes 512 MB RAM workable.
#
# Free-tier limits to expect: service spins down after 15 min idle (cold start
# takes a few minutes — use a free UptimeRobot ping every 5 min to keep it
# warm; 24/7 still fits in the 750 free hours/month), uploaded files are
# ephemeral unless you add S3 storage (see below), and heavy features (big
# file uploads, local speech-to-text) may hit the 512 MB wall.
#
# To switch to building THIS repo's full Dockerfile (heavier, needs a paid
# plan + disk), point dockerfilePath at ./Dockerfile instead.

services:
  - type: web
    name: open-webui
    runtime: image
    image:
      url: ghcr.io/open-webui/open-webui:slim
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Auto-generated session secret. Don't change after first boot
      # or existing logins get invalidated.
      - key: WEBUI_SECRET_KEY
        generateValue: true

      # ---- Persistence (all free-tier compatible) ----
      # External Postgres (REQUIRED on free plan — no disk available).
      # Free options: Neon (neon.tech) or Supabase — both support pgvector.
      # Format: postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Store RAG/knowledge vectors in the same Postgres (via pgvector).
      # PGVECTOR_DB_URL defaults to DATABASE_URL, so nothing else to set —
      # just enable the `vector` extension once (see deploy guide).
      - key: VECTOR_DB
        value: pgvector

      # ---- LLM + embeddings (OpenAI-compatible) ----
      # Needed for chat AND for embeddings (avoids loading a local model into RAM).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        sync: false
      - key: RAG_EMBEDDING_ENGINE
        value: openai
      - key: RAG_EMBEDDING_MODEL
        value: text-embedding-3-small

      # ---- Misc ----
      # Leave empty unless you run Ollama somewhere reachable.
      - key: OLLAMA_BASE_URL
        value: ''
      - key: WEBUI_NAME
        value: Open WebUI
      - key: FORWARDED_ALLOW_IPS
        value: '*'
      - key: SCARF_NO_ANALYTICS
        value: 'true'
      - key: DO_NOT_TRACK
        value: 'true'
      - key: ANONYMIZED_TELEMETRY
        value: 'false'
      # Render routes traffic to the port your service binds. Pinning this
      # explicitly (Render's default is 10000) removes any doubt about
      # $PORT injection on image-runtime services — start.sh honors it.
      - key: PORT
        value: '10000'

      # ---- Optional: persistent file uploads via S3-compatible storage ----
      # Without this, uploaded files/avatars vanish on restart/redeploy.
      # Free option: Cloudflare R2 (10 GB free). Uncomment + fill in to use:
      # - key: STORAGE_PROVIDER
      #   value: s3
      # - key: S3_ENDPOINT_URL
      #   sync: false  # e.g. https://<accountid>.r2.cloudflarestorage.com
      # - key: S3_BUCKET_NAME
      #   sync: false
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false
      # - key: S3_REGION_NAME
      #   value: auto
